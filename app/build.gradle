apply plugin: 'com.android.application'

android {
    compileSdkVersion 37
    defaultConfig {
        applicationId "top.donmor.tiddloid"
        minSdkVersion 21
        targetSdkVersion 36
        multiDexEnabled true
        versionCode 205001
        versionName "2.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            def gitHash = providers.exec {
                commandLine 'git', 'rev-parse', '--short', 'master'
                ignoreExitValue true
            }.standardOutput.asText.get().trim()
            versionNameSuffix "@" + gitHash
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'top.donmor.tiddloid'
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.pixplicity.sharp:sharp:1.1.3@aar'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
